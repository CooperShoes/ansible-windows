# tasks/install-oracle10g.yml
---
- name: Instalar Oracle Client 10G
  hosts: windows
  gather_facts: false

  vars:
    origem_instaladores: "/opt/ansible/files/sistema/oracle"
    oracle_zip: "client-oracle-10g.zip"
    oracle_bat: "install-oracle-10g.bat"

  tasks:
    - name: Criar pasta temporária de instalação
      win_file:
        path: C:\temp
        state: directory
      ignore_errors: true

    - name: Copiar zip do Oracle Client 10G
      win_copy:
        src: "{{ origem_instaladores }}/{{ oracle_zip }}"
        dest: 'C:\temp\{{ oracle_zip }}'
      register: resultado_copia_zip
      ignore_errors: true

    - name: Descompactar arquivo
      community.windows.win_unzip:
        src: 'C:\temp\{{ oracle_zip }}'
        dest: C:\temp\oracle-10g
        delete_archive: true
      register: resultado_unzip
      ignore_errors: true
      when: resultado_copia_zip is success

    - name: Copiar script de instalação
      win_copy:
        src: "{{ origem_instaladores }}/{{ oracle_bat }}"
        dest: 'C:\temp\oracle-10g\client\{{ oracle_bat }}'
      register: resultado_copia_bat
      ignore_errors: true
      when: resultado_unzip is defined and resultado_unzip is success

    - name: Executar instalação Oracle
      win_command: "{{ oracle_bat }}"
      args:
        chdir: 'C:\temp\oracle-10g\client'
        creates: 'C:\oracle\product\10.2.0\client_1\bin\sqlplus.exe'
      async: 1800
      poll: 15
      register: resultado_oracle
      ignore_errors: true
      when: resultado_copia_bat is defined and resultado_copia_bat is success

    - name: Relatório de instalação
      debug:
        msg:
          - "Cópia do ZIP ........ {{ 'OK' if (resultado_copia_zip is defined and resultado_copia_zip is success) else 'FALHOU' }}"
          - "Descompactação ....... {{ 'OK' if (resultado_unzip is defined and resultado_unzip is success) else 'FALHOU' }}"
          - "Instalação Oracle .... {{ 'OK' if (resultado_oracle is defined and resultado_oracle is success) else 'FALHOU' }}"