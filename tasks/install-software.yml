# playbooks/install-software.yml
---
- name: Instalar pacote padrão de software nas estações Windows
  hosts: windows
  gather_facts: false

  tasks:
    - name: Garantir que o Chocolatey está instalado
      win_chocolatey:
        name: chocolatey
        state: present

    - name: Baixar instalador do Google Chrome (Enterprise MSI oficial)
      win_get_url:
        url: https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi
        dest: C:\temp\GoogleChromeEnterprise64.msi

    - name: Instalar Google Chrome via MSI
      win_package:
        path: C:\temp\GoogleChromeEnterprise64.msi
        state: present
        arguments: /quiet /norestart

    - name: Instalar WinRAR
      win_chocolatey:
        name: winrar
        state: present

    - name: Instalar 7-Zip (opcional, alternativa leve)
      win_chocolatey:
        name: 7zip
        state: present
      tags: opcional

    - name: Instalar Adobe Reader
      win_chocolatey:
        name: adobereader
        state: present
      tags: opcional
